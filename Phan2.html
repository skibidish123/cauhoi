<style>
  :root{

  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{

    display:flex;
    flex-direction:column;
    align-items:center;
  }
  body::before{
    content:"";

    background:

      radial-gradient(900px 500px at -10% 110%, rgba(15,46,76,0.08), transparent 60%);

    z-index:0;
  }
  .wrap{

    max-width:760px;
    padding:2rem 1.5rem 4rem;
    position:relative;
    z-index:1;
  }

  .backlink{
    display:inline-flex; align-items:center; gap:.4rem;
    font-size:.85rem; font-weight:600; color:var(--muted);
    text-decoration:none; margin-bottom:1.4rem;
  }
  .backlink:hover{color:var(--maroon);}
  .backlink svg{width:14px; height:14px;}

  header{margin-bottom:2rem;}
  .kicker{
    display:flex; align-items:center; gap:.6rem;
    font-size:.8rem; letter-spacing:.04em; color:var(--maroon); font-weight:600;
    margin-bottom:.5rem;
  }
  .kicker .dash{width:22px; height:2px; background:var(--gold); display:inline-block;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(1.5rem, 3.8vw, 2.1rem);
    line-height:1.2;
    margin:0 0 .4rem;
    color:var(--maroon-dark);

  .sub{color:var(--muted); font-size:.96rem; max-width:56ch;}

  }
  .dot{
    flex:1; min-width:8px; height:7px; border-radius:3px;
    background:var(--line);
    transition:background .3s ease;
  }
  .dot.current{background:var(--gold);}
  .dot.correct{background:var(--good);}
  .dot.wrong{background:var(--bad);}

  .stage{position:relative;}
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:2.1rem 1.9rem;
    box-shadow:0 18px 40px -22px rgba(74,14,23,0.35);

  .qmeta{
    display:flex; justify-content:space-between; align-items:baseline;

  }
  .qnum{

    font-size:1.05rem;
  }
  .qtotal{color:var(--muted); font-size:.85rem;}
  .question{
    font-family:'Fraunces',serif;
    font-size:1.25rem;
    line-height:1.4;
    font-weight:600;
    color:var(--ink);
    margin:0 0 1.5rem;
  }

  .opt{
    display:flex; align-items:center; gap:.85rem;
    text-align:left;
    border:1.5px solid var(--line);
    background:#fffdfb;
    border-radius:10px;
    padding:.8rem 1rem;
    font-family:'Inter',sans-serif;
    font-size:.96rem;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .opt:hover:not(.locked){border-color:var(--maroon); background:#FBF1EC;}
  .opt .letter{
    flex:0 0 auto;
    width:28px; height:28px; border-radius:50%;
    background:var(--cream); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-weight:600; font-size:.85rem; color:var(--maroon);
  }
  .opt.selected{border-color:var(--maroon); background:#FBF1EC;}
  .opt.correct{border-color:var(--good); background:#EAF4EE;}
  .opt.correct .letter{background:var(--good); color:#fff; border-color:var(--good);}
  .opt.incorrect{border-color:var(--bad); background:#FBEDED;}
  .opt.incorrect .letter{background:var(--bad); color:#fff; border-color:var(--bad);}
  .opt.locked{cursor:default;}

  .explain{
    margin-top:1.3rem;
    padding:1rem 1.1rem;
    border-radius:10px;
    background:var(--cream);
    border-left:3px solid var(--gold);
    font-size:.9rem;
    line-height:1.55;
    color:#4a3a35;
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--maroon-dark);}

    display:flex; justify-content:flex-end; margin-top:1.6rem;
  }
  .btn{
    font-family:'Inter',sans-serif;

    padding:.7rem 1.5rem;
    border-radius:9px;
    border:none;
    background:var(--maroon-dark);
    color:#fff;
    cursor:pointer;

  .btn.show{opacity:1; pointer-events:auto; transform:translateY(0);}
  .btn:hover{background:var(--maroon);}

  .result{
    background:linear-gradient(160deg, var(--maroon-dark), var(--navy));

    border-radius:16px;
    padding:3rem 2.2rem;
    text-align:center;
    display:none;

  .result .score{

    color:var(--gold);
    line-height:1;
    margin-bottom:.3rem;
  }
  .result .outof{color:#D8C3B0; font-size:1rem; margin-bottom:1.4rem;}
  .result .verdict{
    font-family:'Fraunces',serif;
    font-size:1.3rem; margin-bottom:.6rem;
  }
  .result p.desc{color:#E7D9CE; max-width:44ch; margin:0 auto 2rem; line-height:1.6; font-size:.95rem;}
  .result .btnrow{display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap;}
  .result .btn{background:var(--gold); color:var(--maroon-dark); opacity:1; pointer-events:auto; transform:none;}
  .result .btn:hover{background:var(--gold-light);}
  .result .btn.secondary{background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,0.4);}
  .result .btn.secondary:hover{background:rgba(255,255,255,0.1);}

  .stage.hidden{display:none;}

  footer{
    margin-top:2.5rem;
    text-align:center;
    color:var(--muted);

</style>

    ],
    "correct": 2,
    "explain": "Nghị quyết 98/2023/QH15 là điểm nhấn cho giai đoạn đổi mới, giúp Thành phố phát huy nguồn lực và cải cách thể chế."
  }
];

const LETTERS = ["A","B","C","D"];
let current = 0;
let score = 0;
const answers = new Array(QUESTIONS.length).fill(null);

const timelineEl = document.getElementById('timeline');
const qnumEl = document.getElementById('qnum');
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const explainEl = document.getElementById('explain');
const nextBtn = document.getElementById('nextBtn');
const quizStage = document.getElementById('quizStage');
const resultStage = document.getElementById('resultStage');
const resultCard = document.getElementById('resultCard');

function buildTimeline(){
  timelineEl.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = 'dot-' + i;
    timelineEl.appendChild(d);
  });
}

function updateTimeline(){
  QUESTIONS.forEach((_, i) => {
    const d = document.getElementById('dot-' + i);
    d.className = 'dot';
    if (answers[i] === 'correct') d.classList.add('correct');
    else if (answers[i] === 'wrong') d.classList.add('wrong');
    else if (i === current) d.classList.add('current');
  });
}

function renderQuestion(){
  const item = QUESTIONS[current];
  qnumEl.textContent = 'Câu ' + (current + 1);
  questionEl.textContent = item.q;
  optionsEl.innerHTML = '';
  explainEl.classList.remove('show');
  explainEl.innerHTML = '';
  nextBtn.classList.remove('show');
  nextBtn.textContent = current === QUESTIONS.length - 1 ? 'Xem kết quả' : 'Câu tiếp theo';

  item.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + opt + '</span>';
    btn.addEventListener('click', () => selectAnswer(i, btn));
    optionsEl.appendChild(btn);
  });
  updateTimeline();
}

function selectAnswer(i, btnEl){
  if (answers[current] !== null) return;
  const item = QUESTIONS[current];
  const isCorrect = i === item.correct;
  answers[current] = isCorrect ? 'correct' : 'wrong';
  if (isCorrect) score++;

  const optBtns = optionsEl.querySelectorAll('.opt');
  optBtns.forEach((b, idx) => {
    b.classList.add('locked');
    if (idx === item.correct) b.classList.add('correct');
    if (idx === i && !isCorrect) b.classList.add('incorrect');
  });

  explainEl.innerHTML = '<b>' + (isCorrect ? 'Chính xác. ' : 'Chưa đúng. ') + '</b>' + item.explain;
  explainEl.classList.add('show');
  nextBtn.classList.add('show');
  updateTimeline();
}

nextBtn.addEventListener('click', () => {
  if (current < QUESTIONS.length - 1){
    current++;
    renderQuestion();
  } else {
    showResult();
  }
});

function showResult(){
  quizStage.classList.add('hidden');
  resultStage.classList.remove('hidden');
  resultCard.classList.add('show');
  document.getElementById('scoreNum').textContent = score + '/' + QUESTIONS.length;
  const pct = Math.round((score / QUESTIONS.length) * 100);
  document.getElementById('scorePct').textContent = pct + '% câu trả lời đúng';

  let verdict, desc;
  if (pct >= 90){ verdict = 'Xuất sắc'; desc = 'Bạn nắm rất vững nội dung phần này.'; }
  else if (pct >= 70){ verdict = 'Khá tốt'; desc = 'Bạn hiểu khá rõ nội dung bài học, chỉ còn vài chi tiết cần ôn lại.'; }
  else if (pct >= 50){ verdict = 'Trung bình'; desc = 'Bạn đã nắm được nội dung chính, hãy xem lại các mốc quan trọng.'; }
  else { verdict = 'Cần ôn lại'; desc = 'Hãy xem lại bài giảng phần này trước khi làm lại bài trắc nghiệm.'; }
  document.getElementById('verdict').textContent = verdict;
  document.getElementById('verdictDesc').textContent = desc;
}

document.getElementById('retryBtn').addEventListener('click', () => {
  current = 0; score = 0;
  answers.fill(null);
  resultStage.classList.add('hidden');
  quizStage.classList.remove('hidden');
  resultCard.classList.remove('show');
  buildTimeline();
  renderQuestion();
});

buildTimeline();
renderQuestion();
</script>
</body>
</html>
